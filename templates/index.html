<!DOCTYPE html>
<html><head><title>Expense Tracker</title></head>
<body style="font-family: sans-serif; max-width: 600px; margin: auto;">
<h2>💰 My Expense Tracker - Codomax Capstone</h2>
<h3>Total Spent: Rs. {{ total }}</h3>
<form action="/add" method="post">
<input name="title" placeholder="Kis cheez me kharcha?" required>
<input name="amount" type="number" placeholder="Amount" required>
<select name="category"><option>Food</option><option>Travel</option><option>Shopping</option><option>Other</option></select>
<button type="submit">Add</button>
</form><hr>
{% for e in expenses %}
<p>{{ e[1] }} - Rs.{{ e[2] }} ({{ e[3] }}) - {{ e[4] }} <a href="/delete/{{ e[0] }}">[Delete]</a></p>
{% endfor %}
</body></html>
